<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">

  <title>Frontend Mentor | Social links profile</title>
</head>
<body>
  <main class="profile-card">
    <img
      class="profile-card__avatar"
      src="./assets/images/avatar-jessica.jpeg"
      alt="Portrait of Jessica Randall"
    >

    <header class="profile-card__header">
      <h1>Jessica Randall</h1>
      <p class="profile-card__location">London, United Kingdom</p>
    </header>

    <p class="profile-card__description">"Front-end developer and avid reader."</p>

    <nav class="profile-card__links" aria-label="Social links">
      <a href="https://github.com/" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="https://www.frontendmentor.io/" target="_blank" rel="noopener noreferrer">Frontend Mentor</a>
      <a href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a href="https://x.com/" target="_blank" rel="noopener noreferrer">Twitter</a>
      <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">Instagram</a>
    </nav>
  </main>
</body>
</html>
